name: Build OSRS Mini APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-mini-launcher/**'
      - '.github/workflows/build-osrs-mini-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-mini-launcher :app:assembleDebug

      - name: Rename APK
        run: cp android-mini-launcher/app/build/outputs/apk/debug/app-debug.apk OSRS-Mini.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OSRS-Mini-APK
          path: OSRS-Mini.apk
          if-no-files-found: error
